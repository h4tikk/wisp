[package]
name = "wisp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A lightweight, agent-friendly, imperative/declarative AUR helper"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.2.1"
directories = "6.0.0"
tempfile = "3"
flate2 = "1"
urlencoding = "2"
regex = "1"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
